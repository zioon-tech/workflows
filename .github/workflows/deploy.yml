name: Deploy CI component
on:
  workflow_call:
    inputs:
      component:
        type: string
        required: true
      ci-run:
        type: string
        required: true
      check-only:
        type: boolean
        default: true
      retire-inactive-builds:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: production-${{ github.repository }}-${{ inputs.component }}
  cancel-in-progress: false
jobs:
  deploy:
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: zioon-tech/workflows
          ref: bd08d8c334ed0376b791301c4d7932f8044c8537
          persist-credentials: false
      - name: Release verified artifact
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_CONFIG: ${{ vars.DEPLOY_CONFIG }}
          DEPLOY_ROLE_ARN: ${{ vars.DEPLOY_ROLE_ARN }}
          DEPLOY_OIDC_PROVIDER_ARN: ${{ vars.DEPLOY_OIDC_PROVIDER_ARN }}
          DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
          DEPLOY_INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}
          CHECK_ONLY: ${{ inputs.check-only }}
          RETIRE_INACTIVE_BUILDS: ${{ inputs.retire-inactive-builds }}
          COMPONENT: ${{ inputs.component }}
          CI_RUN: ${{ inputs.ci-run }}
        run: python3 scripts/release.py "$COMPONENT" "$CI_RUN"
