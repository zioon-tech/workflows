name: Reusable source secret scan
on:
  workflow_call:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify and install Gitleaks
        run: |
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLo "$RUNNER_TEMP/checksums" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          expected="$(awk '$2=="gitleaks_8.30.1_linux_x64.tar.gz" {print $1}' "$RUNNER_TEMP/checksums")"
          test -n "$expected"
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan current source
        run: '"$RUNNER_TEMP/gitleaks" dir . --redact --no-banner'
