name: Reusable Node CI
on:
  workflow_call:
    inputs:
      package-manager:
        type: string
        default: npm
      install:
        type: string
        default: npm ci
      command:
        type: string
        required: true
      artifact-name:
        type: string
        default: ""
      artifact-path:
        type: string
        default: ""
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_DB: zion
          POSTGRES_USER: zion
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zion"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ZION_TEST_POSTGRES_URL: postgresql://zion:test-only@127.0.0.1:5432/zion?sslmode=disable
      ADC_TEST_DATABASE_URL: postgresql://zion:test-only@127.0.0.1:5432/zion?sslmode=disable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.18.0
      - name: Install pinned pnpm
        if: inputs.package-manager == 'pnpm'
        run: npm install --global pnpm@9.14.2
      - name: Install dependencies
        env:
          INSTALL_COMMAND: ${{ inputs.install }}
        run: bash -e -o pipefail -c "$INSTALL_COMMAND"
      - name: Check and build
        env:
          CHECK_COMMAND: ${{ inputs.command }}
        run: bash -e -o pipefail -c "$CHECK_COMMAND"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.artifact-name != ''
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
